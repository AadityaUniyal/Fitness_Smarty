name: Python Backend Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Optional: set up PostgreSQL if the tests need a real DB,
      # but since tests use local SQLite by default, we don't strictly need it.
      # postgres:
      #   image: postgres:15
      #   env:
      #     POSTGRES_DB: smarty_test
      #     POSTGRES_USER: test
      #     POSTGRES_PASSWORD: test
      #   ports:
      #     - 5432:5432

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f backend/requirements-base.txt ]; then pip install -r backend/requirements-base.txt; fi
        if [ -f backend/requirements-ml.txt ]; then pip install -r backend/requirements-ml.txt; fi
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
        pip install pytest httpx fastapi slowapi python-jose bcrypt sqlalchemy alembic requests slowapiSlowapi slowapiSlowapi

    - name: Run tests with pytest
      env:
        ENVIRONMENT: test
        JWT_SECRET_KEY: test_stable_jwt_secret_key_for_ci_cd_pipeline
        SECRET_KEY: test_stable_jwt_secret_key_for_ci_cd_pipeline
        DATABASE_URL: sqlite:///./test_smarty_temp.db
      run: |
        cd backend
        pytest
