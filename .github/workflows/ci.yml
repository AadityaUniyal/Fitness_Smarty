name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f backend/requirements-base.txt ]; then pip install -r backend/requirements-base.txt; fi
        if [ -f backend/requirements-ml.txt ]; then pip install -r backend/requirements-ml.txt; fi
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
        pip install pytest httpx fastapi slowapi python-jose bcrypt sqlalchemy alembic requests slowapi

    - name: Run pytest
      env:
        ENVIRONMENT: test
        JWT_SECRET_KEY: test_stable_jwt_secret_key_for_ci_cd_pipeline
        SECRET_KEY: test_stable_jwt_secret_key_for_ci_cd_pipeline
        DATABASE_URL: sqlite:///./test_smarty_temp.db
      run: |
        cd backend
        pytest
