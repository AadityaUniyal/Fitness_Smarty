name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  ENVIRONMENT: test
  JWT_SECRET_KEY: test_stable_jwt_secret_key_for_ci_cd_pipeline
  SECRET_KEY: test_stable_jwt_secret_key_for_ci_cd_pipeline
  DATABASE_URL: sqlite:///./test_smarty_temp.db

jobs:
  # ─── Backend Tests + Lint ─────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'backend/requirements*.txt'

    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install pytest httpx pytest-cov ruff

    - name: Lint with ruff
      working-directory: backend
      run: |
        python -m ruff check --output-format=github . || true

    - name: Run backend tests with coverage
      working-directory: backend
      run: |
        python -m pytest --tb=short -q --cov=app --cov-report=term-missing --cov-fail-under=15

    - name: Check backend imports
      working-directory: backend
      run: |
        python -c "from main import app; print(f'✅ App loaded with {len(app.routes)} routes')"

  # ─── Frontend Build, Lint & Type Check ────────────────────
  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    - name: TypeScript type check
      working-directory: frontend
      run: npx tsc --noEmit || true

    - name: Run frontend tests
      working-directory: frontend
      run: npm test -- --run || true

    - name: Build frontend
      working-directory: frontend
      env:
        VITE_API_URL: ''
      run: npm run build

    - name: Verify build output
      run: |
        test -f frontend/dist/index.html && echo "✅ Frontend build successful" || (echo "❌ Build failed" && exit 1)

  # ─── Docker Build Test ────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Build backend Docker image
      run: docker build -f docker/Dockerfile.backend -t smarty-backend ../backend || docker build -f backend/Dockerfile -t smarty-backend backend/

    - name: Build frontend Docker image
      run: docker build -f docker/Dockerfile.frontend -t smarty-frontend ../frontend || docker build -f frontend/Dockerfile -t smarty-frontend frontend/
