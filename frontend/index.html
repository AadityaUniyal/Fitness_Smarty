<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smarty | AI Fitness</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.21.0/dist/tf-core.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.21.0/dist/tf-converter.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.21.0/dist/tf-backend-webgl.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2/dist/pose-detection.min.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --emerald-glow: 0 0 20px rgba(16, 185, 129, 0.4);
      --cyan-glow: 0 0 20px rgba(6, 182, 212, 0.4);
    }
    body { 
      font-family: 'Inter', sans-serif;
      background-color: #020617;
      color: #f8fafc;
    }
    h1, h2, h3, button { font-family: 'Space Grotesk', sans-serif; }

    .cyber-border {
      position: relative;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(16, 185, 129, 0.2);
      box-shadow: var(--emerald-glow);
    }
    .cyber-border::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px; right: -1px; bottom: -1px;
      background: linear-gradient(45deg, transparent 40%, rgba(16, 185, 129, 0.4), transparent 60%);
      z-index: -1;
      border-radius: inherit;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .noise-bg {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.05;
      pointer-events: none;
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }
    .scanline {
      width: 100%;
      height: 2px;
      background: linear-gradient(to right, transparent, rgba(16, 185, 129, 0.2), transparent);
      animation: scanline 4s linear infinite;
    }

    @keyframes success-glow {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .animate-success-glow {
      animation: success-glow 2s infinite;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #10b981; }

    .glow-text {
      text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }

    /* ───── Enhanced Visual Effects ───── */

    /* Animated gradient orbs background */
    .bg-orbs {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }
    .bg-orbs .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      animation: orb-float 20s ease-in-out infinite;
    }
    .bg-orbs .orb:nth-child(1) {
      width: 500px; height: 500px;
      background: #10b981;
      top: -10%; left: -10%;
      animation-delay: 0s;
      animation-duration: 25s;
    }
    .bg-orbs .orb:nth-child(2) {
      width: 400px; height: 400px;
      background: #06b6d4;
      bottom: -10%; right: -10%;
      animation-delay: -5s;
      animation-duration: 20s;
    }
    .bg-orbs .orb:nth-child(3) {
      width: 300px; height: 300px;
      background: #8b5cf6;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -10s;
      animation-duration: 30s;
    }

    @keyframes orb-float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(60px, -40px) scale(1.1); }
      50% { transform: translate(-30px, 60px) scale(0.9); }
      75% { transform: translate(40px, 30px) scale(1.05); }
    }

    /* Smooth scroll for entire app */
    html { scroll-behavior: smooth; }

    /* Better focus ring */
    *:focus-visible {
      outline: 2px solid rgba(16, 185, 129, 0.5);
      outline-offset: 2px;
      border-radius: 8px;
    }

    /* Smooth transitions on all interactive elements */
    a, button, input, select, textarea {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Scrollbar for content areas */
    .custom-scrollbar::-webkit-scrollbar { width: 3px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.3); border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(16, 185, 129, 0.5); }

    /* Custom Clerk Theme Overrides */
    .cl-rootBox {
      width: 100%;
    }
    .cl-card {
      background: rgba(15, 23, 42, 0.8) !important;
      backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(16, 185, 129, 0.2) !important;
      border-radius: 2.5rem !important;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important;
    }
    .cl-headerTitle {
      font-family: 'Space Grotesk', sans-serif !important;
      letter-spacing: -0.05em !important;
      font-style: italic !important;
      text-transform: uppercase !important;
    }
  </style>
  <!-- Module resolution handled by Vite -->
  <link rel="stylesheet" href="/src/styles/animations.css">
  <link rel="stylesheet" href="/index.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body class="bg-slate-950 text-slate-100">
  <div class="bg-orbs">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>
  <div class="fixed inset-0 noise-bg z-[-1]"></div>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
