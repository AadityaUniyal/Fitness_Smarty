<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020617">
  <title>SMARTY — Train Intelligently</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.21.0/dist/tf-core.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.21.0/dist/tf-converter.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.21.0/dist/tf-backend-webgl.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2/dist/pose-detection.min.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Inter', sans-serif;
      background-color: var(--smarty-bg-canvas, #020617);
      color: var(--smarty-text-primary, #f8fafc);
    }
    h1, h2, h3, button { font-family: 'Space Grotesk', sans-serif; }

    .glass-panel {
      background: var(--smarty-surface-1, rgba(15, 23, 42, 0.7));
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--smarty-border-glass, rgba(255, 255, 255, 0.08));
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--smarty-bg-canvas, #020617); }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--smarty-accent-primary, #10b981); }

    html { scroll-behavior: smooth; }

    *:focus-visible {
      outline: 2px solid var(--smarty-accent-primary, rgba(16, 185, 129, 0.5));
      outline-offset: 2px;
      border-radius: 8px;
    }

    a, button, input, select, textarea {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--smarty-accent-soft, rgba(16, 185, 129, 0.3)); border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--smarty-accent-glow, rgba(16, 185, 129, 0.5)); }
  </style>
  <link rel="stylesheet" href="/src/styles/designTokens.css">
  <link rel="stylesheet" href="/src/styles/animations.css">
  <link rel="stylesheet" href="/index.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body class="bg-slate-950 text-slate-100 antialiased">
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
